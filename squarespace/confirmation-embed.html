<!--
  SquareSpace RSVP thank-you (use this file)

  Many SquareSpace sites block BOTH fetch() and external <script src> to third-party hosts (CSP).
  The reliable fix is an IFRAME: the page below loads from YOUR Vercel app; Airtable is read on the
  server, so SquareSpace never runs a script from Vercel.

  1) Deploy gng-confirmations and set Airtable env vars on Vercel.
  2) Replace YOUR_VERCEL_HOST below with your origin, e.g. https://gng-confirmations.vercel.app
  3) Add a Code block on your thank-you page and paste the <div>…</div> block only.

  Optional: set the iframe src to …/embed/rsvp-thanks?recordId=recXXXXXXXX for a specific harvest
  (one Code block / one page per harvest, or advanced: automation that sends users to a URL that
  includes the id and use SquareSpace code to forward it—iframe-only setups often use a fixed recordId
  per RSVP form).

  Live embed URL (test in browser): https://YOUR_VERCEL_HOST/embed/rsvp-thanks

  Preconnect + eager iframe improve perceived load (TLS + HTML start earlier than lazy).
-->

<link rel="dns-prefetch" href="https://YOUR_VERCEL_HOST" />
<link rel="preconnect" href="https://YOUR_VERCEL_HOST" crossorigin />

<div style="max-width: 42rem; margin: 0 auto">
  <iframe
    title="RSVP confirmation"
    src="https://YOUR_VERCEL_HOST/embed/rsvp-thanks"
    style="width: 100%; border: 0; display: block; min-height: 380px"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>
